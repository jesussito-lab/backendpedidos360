name: CI/CD Pipeline - Build, Dockerize & Deploy to EC2

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Inspeccionar estructura de archivos
        run: |
          echo "=== Directorio actual ==="
          pwd
          echo "=== Archivos en raíz ==="
          ls -la

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: |
          if [ -d "pedidos360-backend" ]; then
            cd pedidos360-backend
          fi
          echo "=== Directorio de trabajo para Maven ==="
          pwd
          mvn clean package -DskipTests

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TARGET_DIR="."
          if [ -d "pedidos360-backend" ]; then
            TARGET_DIR="pedidos360-backend"
          fi
          docker build -t $IMAGE_LOWER:latest $TARGET_DIR
          docker push $IMAGE_LOWER:latest

      - name: Desplegar en AWS EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            docker pull $IMAGE_LOWER:latest
            docker stop pedidos-service || true
            docker rm pedidos-service || true
            docker run -d --name pedidos-service --restart always --net=host $IMAGE_LOWER:latest